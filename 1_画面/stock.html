<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナイトだんどり｜在庫・発注</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body data-seed="night">

<!-- ======================= ログイン ======================= -->
<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>ナイトだんどり</h1>
    <p>在庫・発注</p>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" style="width:100%" id="loginBtn" type="submit">ログイン</button>
  </form>
</div>

<!-- ======================= 本体 ======================= -->
<div id="app" class="hidden">
  <header>
    <span class="brand">DANDORI</span>
    <select id="storeSel" aria-label="店舗"></select>
    <span class="who">
<a class="btn ghost" href="guide.html#stock" target="_blank" rel="noopener"
         style="padding:6px 12px;text-decoration:none">使い方</a>
      <span id="meName" style="display:none"></span>
      <button class="btn ghost" id="logoutBtn" style="padding:6px 12px">ログアウト</button>
    </span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="list" aria-selected="true">商品・在庫</button>
    <button role="tab" data-view="order" data-boss="1" aria-selected="false">発注</button>
  </nav>

  <main>

    <!-- ---------- 商品・在庫 ---------- -->
    <section id="view-list">
      <div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="row">
          <input id="pQ" type="search" placeholder="品名・分類でさがす">
        </div>
        <div class="row" style="gap:8px">
          <button class="btn primary" id="pNew" data-boss="1">商品を足す</button>
          <button class="btn ghost" id="pSeed" data-boss="1">ひな形を入れる</button>
          <button class="btn ghost" id="pReload">更新</button>
        </div>
      </div>

      <div id="pLow"></div>

      <div class="panel">
        <h2>商品と、いまの在庫</h2>
        <p style="color:var(--muted);font-size:12.5px;margin-top:-4px">
          使ったぶん・捨てたぶんは「出し入れ」から入れてください。
          数がずれたときは「棚卸」で合わせます。
        </p>
        <div class="scroll" style="margin-top:12px"><table class="list" id="pTable"></table></div>
        <div class="empty hidden" id="pEmpty">
          商品がまだありません。「ひな形を入れる」から始められます。
        </div>
      </div>
    </section>

    <!-- ---------- 発注 ---------- -->
    <section id="view-order" class="hidden">
      <div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="row" style="gap:8px">
          <label class="field" style="margin:0">
            <span style="font-size:12px;color:var(--muted)">状態</span>
            <select id="oStatus">
              <option value="">すべて</option>
              <option value="draft">下書き</option>
              <option value="sent">発注ずみ</option>
              <option value="received">納品ずみ</option>
              <option value="cancel">取り消し</option>
            </select>
          </label>
          <button class="btn ghost" id="oReload" style="margin-top:18px">更新</button>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn primary" id="oSuggest">足りないものから下書きを作る</button>
          <button class="btn ghost" id="oNew">からの発注書</button>
        </div>
      </div>

      <div class="panel">
        <h2>発注書</h2>
        <p style="color:var(--muted);font-size:12.5px;margin-top:-4px">
          下書き → 発注ずみ → 納品ずみ、の順に進みます。
          「納品した」を押すと、届いたぶんだけ在庫がふえます。
        </p>
        <div class="scroll" style="margin-top:12px"><table class="list" id="oTable"></table></div>
        <div class="empty hidden" id="oEmpty">
          発注書はまだありません。「足りないものから下書きを作る」から始められます。
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="art.js"></script>
<script src="photo.js"></script>
<script src="ui.js"></script>
<script src="pw.js"></script>
<script src="perm.js"></script>
<script src="kyotsu.js"></script>
<script src="stock.js"></script>
<script src="menu.js"></script>
</body>
</html>

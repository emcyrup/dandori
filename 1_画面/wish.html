<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト希望</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<style>
/* 本人が開く画面だけの見た目。スマホで押しやすい大きさにしています */
body.wish  { background:#f7f5f1; color:#241c14; }
.w-wrap    { max-width:560px; margin:0 auto; padding:0 0 150px; }
.w-head    { background:#fff; padding:16px; border-bottom:1px solid #e7ded2; }
.w-head h1 { font-size:19px; margin:0; }
.w-head p  { margin:5px 0 0; font-size:13.5px; color:#7a6a58; }
.w-state   { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:999px;
             font-size:13px; background:#efe8dd; }
.w-state.ok{ background:#d9ecd9; }
.w-state.rt{ background:#fbe6d6; }
.w-msg     { margin:12px 16px; padding:13px 15px; background:#fff8ef;
             border:1px solid #f0d9c2; border-left:4px solid #c0451f; border-radius:10px;
             font-size:14px; line-height:1.8; white-space:pre-wrap; }
.w-legend  { display:flex; gap:14px; padding:12px 16px 4px; font-size:12.5px; color:#7a6a58;
             flex-wrap:wrap; }
.w-legend i{ display:inline-block; width:13px; height:13px; border-radius:4px;
             margin-right:5px; vertical-align:-2px; border:1px solid #d9cdbc; }
.w-cal     { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; padding:8px 12px; }
.w-dow     { text-align:center; font-size:12px; color:#7a6a58; padding:4px 0; }
.w-dow.sun { color:#c0451f; } .w-dow.sat { color:#2a5fa0; }
.w-day     { border:1px solid #e0d5c5; background:#fff; border-radius:10px; padding:7px 3px;
             min-height:62px; font:inherit; cursor:pointer; display:flex;
             flex-direction:column; align-items:center; gap:2px; }
.w-day .d  { font-size:15px; font-weight:700; }
.w-day .t  { font-size:10.5px; color:#7a6a58; line-height:1.3; }
.w-day.pad { border:0; background:transparent; cursor:default; }
.w-day.ok  { background:#e6f2e6; border-color:#9cc49c; }
.w-day.want{ background:#fdf0d6; border-color:#e0bd6b; }
.w-day.ng  { background:#f7e0de; border-color:#d79a94; }
.w-day.ok .t, .w-day.want .t, .w-day.ng .t { color:#3c2f22; }
.w-day:disabled { opacity:.5; cursor:default; }
.w-note    { padding:4px 16px 16px; }
.w-note textarea { width:100%; border:1px solid #e0d5c5; border-radius:10px; padding:11px;
             font:inherit; font-size:14px; background:#fff; color:#241c14; }
.w-fixed   { margin:14px 16px; padding:14px 16px; background:#fff; border:1px solid #e7ded2;
             border-radius:12px; }
.w-fixed h2{ font-size:15px; margin:0 0 8px; }
.w-fixed ul{ margin:0; padding:0; list-style:none; }
.w-fixed li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0;
             border-bottom:1px solid #f0ebe3; font-size:14.5px; }
.w-fixed li:last-child { border-bottom:0; }
.w-bar     { position:fixed; left:0; right:0; bottom:0; background:#fff;
             border-top:1px solid #e7ded2;
             padding:12px 16px calc(12px + env(safe-area-inset-bottom));
             display:flex; gap:10px; align-items:center; }
.w-bar .s  { flex:1; font-size:13.5px; line-height:1.5; }
.w-btn     { border:0; border-radius:12px; padding:14px 18px; font-size:15px; font-weight:700; }
.w-btn.main{ background:#a9822f; color:#fff; }
.w-btn.sub { background:#f0e9df; color:#241c14; }
.w-btn:disabled { opacity:.4; }
.w-pick    { position:fixed; inset:0; z-index:30; background:rgba(30,22,14,.55);
             display:flex; align-items:flex-end; }
.w-pick .b { background:#fff; width:100%; border-radius:18px 18px 0 0; padding:18px 16px
             calc(18px + env(safe-area-inset-bottom)); max-height:86vh; overflow-y:auto; }
.w-pick h2 { font-size:17px; margin:0 0 4px; }
.w-pick p  { margin:0 0 14px; font-size:13px; color:#7a6a58; }
.w-opt     { display:block; width:100%; text-align:left; border:1px solid #e0d5c5;
             background:#fff; border-radius:12px; padding:14px 16px; font:inherit;
             font-size:15px; margin-bottom:9px; color:#241c14; }
.w-opt b   { display:block; }
.w-opt small { color:#7a6a58; }
.w-opt.on  { border-color:#a9822f; background:#faf3e6; }
.w-times   { display:flex; gap:10px; margin:6px 0 14px; }
.w-times label { flex:1; font-size:12.5px; color:#7a6a58; }
.w-times input { width:100%; border:1px solid #e0d5c5; border-radius:10px; padding:11px;
             font:inherit; font-size:15px; background:#fff; color:#241c14; }
.w-msgbox  { padding:40px 20px; text-align:center; }
.w-msgbox h2 { font-size:19px; }
</style>
</head>
<body class="wish">

<div class="w-wrap" id="wrap">
  <div class="w-msgbox"><h2>よみこんでいます…</h2></div>
</div>

<div id="toast"></div>
<div id="pickRoot"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="wish.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト希望・承認</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>だんどり</h1>
    <p>シフト希望・承認</p>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" style="width:100%" id="loginBtn" type="submit">ログイン</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <span class="brand">DANDORI</span>
    <select id="storeSel" aria-label="店舗"></select>
    <span class="who">
<span id="meName" style="display:none"></span>
      <button class="btn ghost" id="logoutBtn" style="padding:6px 12px">ログアウト</button>
    </span>
  </header>

  <main>
    <section>
      <div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="row">
          <select id="pSel"></select>
          <button class="btn primary" id="pNew" data-boss="1">つぎの募集を開く</button>
        </div>
        <div class="row">
          <button class="btn ghost" id="pLinks" data-boss="1">本人用リンクを配る</button>
          <button class="btn ghost" id="pRemind" data-boss="1">まだの人に催促</button>
          <button class="btn ghost" id="pCount">日ごとの人数</button>
        </div>
      </div>
      <div id="pHead"></div>
      <div class="tablewrap"><table class="list" id="pTable"></table></div>
    </section>
  </main>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="perm.js"></script>
<script src="art.js"></script>
<script src="photo.js"></script>
<script src="ui.js"></script>
<script src="pw.js"></script>
<script src="kyotsu.js"></script>
<script src="shiftwish.js"></script>
<script src="menu.js"></script>
</body>
</html>

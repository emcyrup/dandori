<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナイトだんどり｜キャスト・給与</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======================= ログイン ======================= -->
<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>ナイトだんどり</h1>
    <p>キャスト・給与</p>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" style="width:100%" id="loginBtn" type="submit">ログイン</button>
  </form>
</div>

<!-- ======================= 本体 ======================= -->
<div id="app" class="hidden">
  <header>
    <span class="brand">DANDORI</span>
    <select id="storeSel" aria-label="店舗"></select>
    <span class="who">
<a class="btn ghost" href="guide.html#attend" target="_blank" rel="noopener" style="padding:6px 12px;text-decoration:none">使い方</a>
      <span id="meName" style="display:none"></span>
      <button class="btn ghost" id="logoutBtn" style="padding:6px 12px">ログアウト</button>
    </span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="attend" aria-selected="true">出勤</button>
    <button role="tab" data-view="calc" data-boss="1"   aria-selected="false">給与</button>
    <button role="tab" data-view="slip"   aria-selected="false">明細</button>
    <button role="tab" data-view="month" data-boss="1"  aria-selected="false">月別</button>
    <button role="tab" data-view="cast"   aria-selected="false">キャスト設定</button>
    <button role="tab" data-view="roster" aria-selected="false">名簿</button>
  </nav>

  <main>

    <!-- ---------- 出勤 ---------- -->
    <section id="view-attend">
      <div class="row" style="margin-bottom:12px">
        <label class="field" style="margin:0">
          <span style="font-size:12px;color:var(--muted)">営業日</span>
          <input id="attDate" type="date">
        </label>
        <button class="btn ghost" id="attReload" style="margin-top:18px">表示</button>
      </div>
      <div class="cards" id="attCards"></div>
    </section>

    <!-- ---------- 給与 ---------- -->
    <section id="view-calc" class="hidden">
      <div class="panel">
        <h2>期間で締める</h2>
        <div class="row" style="margin-bottom:6px">
          <label class="field" style="margin:0">
            <span style="font-size:12px;color:var(--muted)">開始</span>
            <input id="pFrom" type="date">
          </label>
          <label class="field" style="margin:0">
            <span style="font-size:12px;color:var(--muted)">終了</span>
            <input id="pTo" type="date">
          </label>
          <button class="btn ghost" id="pQuickHalf" style="margin-top:18px">今月前半</button>
          <button class="btn ghost" id="pQuickMonth" style="margin-top:18px">今月</button>
          <button class="btn primary" id="pCalc" style="margin-top:18px">試算する</button>
        </div>
        <p style="color:var(--muted);font-size:12.5px;margin:4px 0 0">
          試算した時点では保存されません。内容を確認してから「この期間を確定する」を押してください。
        </p>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2>試算結果</h2>
        <div class="scroll"><table class="list" id="payTable"></table></div>
        <div class="empty hidden" id="payEmpty">期間を選んで「試算する」を押してください。</div>
        <div class="row" style="margin-top:14px" id="payActions"></div>
      </div>
    </section>

    <!-- ---------- 明細 ---------- -->
    <section id="view-slip" class="hidden">
      <div class="panel">
        <h2>給与明細</h2>
        <div class="row" style="margin-bottom:6px">
          <label class="field" style="margin:0">
            <span style="font-size:12px;color:var(--muted)">対象の月</span>
            <input id="slipYm" type="month">
          </label>
          <button class="btn ghost" id="slipLoad" style="margin-top:18px">表示</button>
          <button class="btn ghost" id="slipIssue" data-boss="1" style="margin-top:18px">この月の明細をつくる</button>
          <button class="btn primary" id="slipSendAll" data-boss="1" style="margin-top:18px">まとめて送る</button>
        </div>
        <p style="color:var(--muted);font-size:12.5px;margin:4px 0 0">
          明細は、確定した給与からつくられます。先に「給与」タブで確定してください。
          送り方は、お一人ずつの希望（印刷・LINE・メール）にしたがいます。
        </p>
        <div id="slipOutbox" style="margin-top:10px"></div>
      </div>

      <div class="panel" style="margin-top:14px">
        <div class="scroll"><table class="list" id="slipTable"></table></div>
        <div class="empty hidden" id="slipEmpty">この月の明細はまだありません。</div>
      </div>
    </section>

    <!-- ---------- 月別 ---------- -->
    <section id="view-month" class="hidden">
      <div class="panel">
        <h2>月別の人件費</h2>
        <div class="row" style="margin-bottom:10px">
          <button class="btn ghost" id="mo6">直近6か月</button>
          <button class="btn ghost" id="mo12">直近12か月</button>
          <button class="btn ghost" id="moCsv">CSVで保存</button>
        </div>
        <div id="moChart"></div>
        <div class="scroll" style="margin-top:14px"><table class="list" id="moTable"></table></div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2>お一人ごとの履歴</h2>
        <div class="row" style="margin-bottom:10px">
          <label class="field" style="margin:0;min-width:180px">
            <span style="font-size:12px;color:var(--muted)">キャスト</span>
            <select id="moCast"></select>
          </label>
        </div>
        <div class="scroll"><table class="list" id="moCastTable"></table></div>
      </div>
    </section>

    <!-- ---------- キャスト設定 ---------- -->
    <section id="view-cast" class="hidden">
      <div class="panel">
        <h2>キャストと時給</h2>
        <div class="scroll"><table class="list" id="castTable"></table></div>
        <div class="row" style="margin-top:14px">
          <button class="btn primary" id="castAdd">キャストを追加</button>
        </div>
      </div>
    </section>

    <!-- ---------- 名簿 ---------- -->
    <section id="view-roster" class="hidden">
      <div class="panel" id="rosterPanel">
        <h2>従業者名簿</h2>
        <div id="rosterAlert"></div>
        <div class="scroll"><table class="list" id="rosterTable"></table></div>
        <div class="row" style="margin-top:14px" id="rosterActions">
          <button class="btn ghost" id="rosterPrint">名簿を印刷</button>
          <span style="color:var(--muted);font-size:12.5px">
            記載事項や保存期間の要件は、営業の種別と自治体で変わります。実際の様式は行政書士にご確認ください。
          </span>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="art.js"></script>
<script src="photo.js"></script>
<script src="ui.js"></script>
<script src="pw.js"></script>
<script src="perm.js"></script>
<script src="payroll.js"></script>
<script src="menu.js"></script>
</body>
</html>

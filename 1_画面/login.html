<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナイトだんどり｜ログインの管理</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>ナイトだんどり</h1>
    <p>ログインの管理</p>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" style="width:100%" id="loginBtn" type="submit">ログイン</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <span class="brand">DANDORI</span>
    <select id="storeSel" aria-label="店舗"></select>
    <span class="who">
      <a class="btn ghost" href="guide.html" target="_blank" rel="noopener"
         style="padding:6px 12px;text-decoration:none">使い方</a>
      <span id="meName" style="display:none"></span>
      <button class="btn ghost" id="logoutBtn" style="padding:6px 12px">ログアウト</button>
    </span>
  </header>

  <main>
    <div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="row"><button class="btn ghost" id="lReload">更新</button></div>
      <div class="row"><button class="btn primary" id="lAdd">スタッフを足す</button></div>
    </div>

    <div id="lSum"></div>

    <div class="panel" style="margin-top:12px">
      <h2>はたらく方と、ログイン</h2>
      <p style="color:var(--muted);font-size:12.5px;margin-top:-4px">
        スタッフさんが増えたら、ここから名簿に足して、ログインを作ってください。
        担当への連絡は要りません。辞められた方は「止める」で、その場で入れなくなります。
      </p>
      <div class="scroll" style="margin-top:12px"><table class="list" id="lTable"></table></div>
      <div class="empty hidden" id="lEmpty">まだどなたも登録されていません。</div>
    </div>

    <div class="box" style="margin-top:14px">
      <b>ログインの渡しかたは、2つあります。</b>
      <b>その場で仮パスワードを出す</b>……画面に出た文字を、口頭やメモでお渡しします。
      メールを見ない方でも渡せます。<br>
      <b>ご案内のメールを送る</b>……ご本人がリンクをひらいて、自分でパスワードを決めます。
      店長さんはパスワードを知りません。いちばん安全です。
    </div>
  </main>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="art.js"></script>
<script src="photo.js"></script>
<script src="ui.js"></script>
<script src="pw.js"></script>
<script src="perm.js"></script>
<script src="kyotsu.js"></script>
<script src="login.js"></script>
<script src="menu.js"></script>
</body>
</html>

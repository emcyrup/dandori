# ナイトだんどり 本番サーバー用の入口
#   サーバーの nginx（https）→ 127.0.0.1:8032 → ここ(8000)
#   画面（1_画面）と API を、同じアドレスで出します。
server {
  listen 8000;
  client_max_body_size 50m;
  root /site;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location = /health { access_log off; return 200 "ok\n"; }

  location /rest/v1/      { proxy_pass http://rest:3000/; }
  location /auth/v1/      { proxy_pass http://auth:9999/; }
  location /storage/v1/   { proxy_pass http://storage:5000/; proxy_request_buffering off; }
  location /functions/v1/ { proxy_pass http://functions:9000/; proxy_read_timeout 150s; }

  # 画面：Netlify の _headers と同じく「毎回確認」
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
  }
}

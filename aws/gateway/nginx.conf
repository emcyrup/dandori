# ナイトだんどり API の入口（Supabase の Kong の代わり）
# CloudFront → ALB → ここ(8000) → 同じタスク内の各部品（localhost）
server {
  listen 8000;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location = /health { access_log off; return 200 "ok\n"; }

  # データ（PostgREST）
  location /rest/v1/ { proxy_pass http://127.0.0.1:3000/; }

  # ログイン（GoTrue）
  location /auth/v1/ { proxy_pass http://127.0.0.1:9999/; }

  # ファイル（Storage → S3）
  location /storage/v1/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_request_buffering off;
  }

  # サーバー処理（Edge Functions をそのまま動かす）
  location /functions/v1/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_read_timeout 150s;
  }

  location / { return 404; }
}

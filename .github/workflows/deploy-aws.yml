name: deploy-aws

# main に画面の変更が入ったら AWS に配る。PR では文法チェックだけ。
on:
  push:
    branches: [main]
    paths: ["1_画面/**", "aws/deploy.sh", ".github/workflows/deploy-aws.yml"]
  pull_request:
    paths: ["1_画面/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check
        run: for f in 1_画面/*.js; do node --check "$f"; done

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
        run: bash aws/deploy.sh "${{ vars.AWS_STACK_NAME || 'dandori-night' }}"

name: deploy-server

# main に入ったら、店舗ごとの本番サーバーへ SSH で配備する。
#   ・店舗は GitHub の「Environment」1つにつき1店舗（例: olivia）。Variables / Secrets を店舗ごとに持つ
#   ・配備する店舗の一覧は、リポジトリの Variables の STORES（例: olivia,second）。無ければ olivia だけ
#   ・ソースを tar で送る（サーバーに git も Docker も要らない）
#   ・server/install.sh → setup.sh → deploy.sh --auto（初回は --init、2回目からは入れ替え）
#   ・2_データベース か stores/<店舗>/ に変更があったときだけ、SQL を流す
#
# 店舗の Environment（Settings → Environments → New environment、名前は店舗名）に入れるもの
#   Secrets  : SERVER_SSH_KEY（配布された秘密鍵の中身）, DB_PASSWORD
#              DB_ADMIN_PASSWORD（postgres のパスワード。あれば役割を初回に自動で作る。終わったら消してよい）
#              同じ PostgreSQL に2店舗目を置くとき: AUTHENTICATOR_PASSWORD / AUTH_ADMIN_PASSWORD / STORAGE_ADMIN_PASSWORD
#                （最初の店舗のサーバー上 .env と同じ値。役割はサーバー内で共有のため）
#              任意: SMTP_USER / SMTP_PASS / SMTP_ADMIN_EMAIL / ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY / PIXABAY_API_KEY
#   Variables: SERVER_HOST, SERVER_USER, SERVER_DIR, SITE_URL, LISTEN_PORT, DB_NAME, DB_USER
#              （olivia は下の既定値が入っているので、無くても動く）
on:
  push:
    branches: [main]
    paths: ["1_画面/**", "2_データベース/**", "3_サーバー/**", "stores/**", "server/**", "aws/migrator/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:
    inputs:
      store:
        description: "配備する店舗（空なら STORES の全部）"
        type: string
        default: ""
      run_sql:
        description: "SQL を全部流す"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stores: ${{ steps.list.outputs.stores }}
      run_sql: ${{ steps.sql.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 文法チェック
        run: |
          for f in 1_画面/*.js; do node --check "$f"; done
          for f in server/*.sh aws/*.sh; do bash -n "$f"; done
          sh -n aws/migrator/migrate.sh
          for f in server/gateway/*.mjs server/storage/*.mjs server/lib/*.mjs server/outbox/*.mjs; do node --check "$f"; done
      - name: 配備する店舗
        id: list
        run: |
          raw="${{ inputs.store }}"
          [ -n "$raw" ] || raw="${{ vars.STORES }}"
          [ -n "$raw" ] || raw="olivia"
          json=$(echo "$raw" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(s.trim().split("\n"))))')
          echo "stores=$json" >> "$GITHUB_OUTPUT"
          echo "店舗: $json"
      - name: SQL を流すか
        id: sql
        run: |
          run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run="${{ inputs.run_sql }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && \
               [ -n "$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 2_データベース stores aws/migrator 2>/dev/null)" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "SQL を流す: $run"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        store: ${{ fromJSON(needs.plan.outputs.stores) }}
    environment: ${{ matrix.store }}
    concurrency:
      group: deploy-${{ matrix.store }}
      cancel-in-progress: false
    env:
      STORE:       ${{ matrix.store }}
      SERVER_HOST: ${{ vars.SERVER_HOST || '15.168.86.215' }}
      SERVER_USER: ${{ vars.SERVER_USER || '3piece_prod4' }}
      SERVER_DIR:  ${{ vars.SERVER_DIR  || format('dandori-{0}', matrix.store) }}
      SITE_URL:    ${{ vars.SITE_URL    || 'https://dandori.olivia.ai-labo.cloud' }}
      LISTEN_PORT: ${{ vars.LISTEN_PORT || '8032' }}
      DB_NAME:     ${{ vars.DB_NAME     || 'dandoriolivia' }}
      DB_USER:     ${{ vars.DB_USER     || 'ai_labo_dbuser' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH の準備
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "!! Environment「$STORE」の Secrets に SERVER_SSH_KEY がありません"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          ssh prod 'echo "接続OK: $(whoami)@$(hostname) node $(node -v 2>/dev/null)"'

      - name: ソースを送る（~/${{ env.SERVER_DIR }}）
        run: |
          git archive --format=tar HEAD 1_画面 2_データベース 3_サーバー stores aws server README_はじめにお読みください.txt | gzip > /tmp/src.tgz
          ssh prod "mkdir -p ~/$SERVER_DIR && cd ~/$SERVER_DIR && rm -rf 1_画面 2_データベース 3_サーバー stores aws && tar -xzf -" < /tmp/src.tgz
          ssh prod "cd ~/$SERVER_DIR && chmod +x server/*.sh aws/*.sh aws/migrator/migrate.sh && ls stores"

      - name: 設定（Variables / Secrets → .env）
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          AUTHENTICATOR_PASSWORD: ${{ secrets.AUTHENTICATOR_PASSWORD }}
          AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}
          STORAGE_ADMIN_PASSWORD: ${{ secrets.STORAGE_ADMIN_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          [ -n "$DB_PASSWORD" ] || { echo "!! Environment「$STORE」の Secrets に DB_PASSWORD がありません"; exit 1; }
          for k in STORE SITE_URL LISTEN_PORT DB_NAME DB_USER DB_PASSWORD DB_ADMIN_USER DB_ADMIN_PASSWORD AUTHENTICATOR_PASSWORD AUTH_ADMIN_PASSWORD STORAGE_ADMIN_PASSWORD SMTP_USER SMTP_PASS SMTP_ADMIN_EMAIL ANTHROPIC_API_KEY GEMINI_API_KEY OPENAI_API_KEY PIXABAY_API_KEY; do
            printf '%s' "${!k}" | ssh prod "cd ~/$SERVER_DIR/server && ./env-set.sh $k \"\$(cat)\""
          done
          ssh prod "cd ~/$SERVER_DIR/server && ./setup.sh"

      - name: 部品を入れる（初回だけ時間がかかる）
        run: ssh prod "cd ~/$SERVER_DIR/server && ./install.sh"

      - name: 配備
        run: ssh prod "cd ~/$SERVER_DIR/server && ./deploy.sh --auto"

      - name: SQL（データベースに変更があったとき）
        if: needs.plan.outputs.run_sql == 'true'
        # grep で NOTICE を間引くが、SQL が失敗したら pipefail でこの step も失敗させる
        run: ssh prod "bash -o pipefail -c 'cd ~/$SERVER_DIR/server && ./db.sh schema 2>&1 | grep -v NOTICE'"

      - name: 公開 URL の確認
        run: |
          code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$SITE_URL/login.html" || echo 000)
          echo "$SITE_URL/login.html → $code"
          [ "$code" = "200" ]
